<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĐỀ SỐ 65 - MÔN LỊCH SỬ</title>
<style>
  :root{
    --navy:#1b2432;
    --navy-2:#232e40;
    --yellow:#f4c531;
    --pink:#b6579a;
    --blue:#4a6fa5;
    --green:#3fae5a;
    --red:#d9534f;
    --text:#f2f2f2;
    --muted:#c7cdd6;
    --bg-outer:#c6de2a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-outer);
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  #app{
    width:100%;
    max-width:760px;
    background:var(--navy);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    background:var(--navy);
    padding:22px 20px 14px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:5;
  }
  header h1{
    color:var(--text);
    font-size:1.35rem;
    letter-spacing:0.5px;
    margin:0 0 4px;
    font-weight:800;
  }
  header .subtitle{
    color:var(--muted);
    font-size:0.85rem;
    margin:0 0 14px;
  }
  .timer-bar{
    background:var(--yellow);
    color:#1b2432;
    font-weight:700;
    border-radius:8px;
    padding:10px 14px;
    font-size:0.95rem;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .progress-wrap{
    padding:10px 20px 0;
  }
  .progress-track{
    background:#2c3648;
    border-radius:6px;
    height:8px;
    overflow:hidden;
  }
  .progress-fill{
    background:var(--green);
    height:100%;
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    color:var(--muted);
    font-size:0.8rem;
    margin:6px 2px 0;
    text-align:right;
  }
  main{
    padding:16px 16px 8px;
  }
  .section-title{
    color:var(--yellow);
    font-size:1.05rem;
    font-weight:800;
    margin:22px 4px 12px;
    padding-top:6px;
    border-top:1px solid #33405a;
  }
  .section-title:first-child{
    border-top:none;
    margin-top:4px;
  }
  .qcard{
    background:var(--pink);
    border-radius:14px;
    padding:16px 18px 20px;
    margin-bottom:18px;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .qcard h3{
    color:#fff;
    margin:0 0 14px;
    font-size:1.02rem;
    font-weight:700;
    line-height:1.45;
  }
  .qcard .qnum{
    opacity:0.85;
    font-weight:700;
  }
  .option{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.05);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:10px;
    padding:10px 8px;
    margin-bottom:8px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    user-select:none;
  }
  .option:hover{
    background:rgba(255,255,255,0.1);
    border-color:rgba(255,255,255,0.4);
  }
  .option.selected{
    background:rgba(244,197,49,0.22);
    border-color:var(--yellow);
    box-shadow:0 0 0 1px var(--yellow) inset;
  }
  .option.selected span{ font-weight:700; }
  .option input{
    accent-color:#fff;
    width:18px;
    height:18px;
    flex-shrink:0;
    pointer-events:none;
    margin-top:2px;
    align-self:flex-start;
  }
  .option span{
    color:#fdfdfd;
    font-size:0.95rem;
    line-height:1.4;
  }
  .option.correct{
    background:rgba(63,174,90,0.35);
    border-color:var(--green);
    box-shadow:0 0 0 1px var(--green) inset;
  }
  .option.wrong{
    background:rgba(217,83,79,0.35);
    border-color:var(--red);
    box-shadow:0 0 0 1px var(--red) inset;
  }
  .option.disabled{ cursor:default; }

  .explain-box{
    display:none;
    margin-top:10px;
    background:rgba(0,0,0,0.18);
    border-radius:8px;
    padding:10px 12px;
    color:#fff0f7;
    font-size:0.85rem;
    line-height:1.5;
  }
  .explain-box.show{ display:block; }
  .explain-box b{ color:var(--yellow); }

  .tf-card{
    background:var(--blue);
    border-radius:14px;
    padding:16px 18px 20px;
    margin-bottom:18px;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .tf-card .context{
    color:#eef2fa;
    background:rgba(0,0,0,0.18);
    border-radius:8px;
    padding:10px 12px;
    font-size:0.85rem;
    line-height:1.55;
    white-space:pre-line;
    margin-bottom:14px;
    font-style:italic;
  }
  .tf-item{
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:10px;
  }
  .tf-item .tf-text{
    color:#fff;
    font-size:0.93rem;
    line-height:1.45;
    margin-bottom:8px;
  }
  .tf-buttons{
    display:flex;
    gap:8px;
  }
  .tf-btn{
    flex:1;
    text-align:center;
    padding:8px 6px;
    border-radius:8px;
    border:2px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.05);
    color:#fff;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .tf-btn:hover{ background:rgba(255,255,255,0.12); }
  .tf-btn.selected{
    background:rgba(244,197,49,0.28);
    border-color:var(--yellow);
  }
  .tf-btn.correct{
    background:rgba(63,174,90,0.4);
    border-color:var(--green);
  }
  .tf-btn.wrong{
    background:rgba(217,83,79,0.4);
    border-color:var(--red);
  }
  .tf-btn.disabled{ cursor:default; }

  #result-bar{
    position:sticky;
    bottom:0;
    background:var(--navy-2);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #33405a;
    gap:10px;
    flex-wrap:wrap;
  }
  #result-bar .score{
    color:var(--yellow);
    font-weight:800;
    font-size:0.95rem;
    line-height:1.4;
  }
  #submit-btn{
    background:var(--yellow);
    border:none;
    color:#1b2432;
    font-weight:800;
    padding:10px 22px;
    border-radius:8px;
    font-size:0.95rem;
    cursor:pointer;
  }
  #submit-btn:disabled{ opacity:0.5; cursor:default; }
  #restart-btn{
    display:none;
    background:var(--navy-2);
    color:var(--text);
    border:1px solid var(--yellow);
    padding:10px 22px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
  }
  .snowflake{
    position:absolute;
    top:-10%;
    color:rgba(255,255,255,0.35);
    pointer-events:none;
    font-size:14px;
    animation-name:snowfall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    will-change:transform;
  }
  @keyframes snowfall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); }
    25%{ transform:translateY(25vh) translateX(12px) rotate(90deg); }
    50%{ transform:translateY(55vh) translateX(-10px) rotate(180deg); }
    75%{ transform:translateY(80vh) translateX(14px) rotate(270deg); }
    100%{ transform:translateY(115vh) translateX(0) rotate(360deg); }
  }
  #snow-layer{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
</style>
</head>
<body>
<div id="snow-layer"></div>
<div id="app">
  <header>
    <h1>GIẢI ĐỀ SỐ 65 - MÔN LỊCH SỬ</h1>
    <div class="subtitle">Kỳ thi thử Tốt nghiệp THPT 2025 - 2026</div>
    <div class="timer-bar">⏱ Thời gian làm bài: <span id="timer">45:00</span></div>
  </header>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0/40 đã trả lời</div>
  </div>
  <main id="quiz"></main>
  <div id="result-bar">
    <div>
      <div class="score" id="scoreLabel">Điểm: Phần I 0/24 · Phần II 0/16 · Tổng 0/40</div>
      <div id="emailStatus" style="font-size:0.78rem;color:#c7cdd6;margin-top:4px;"></div>
    </div>
    <div>
      <button id="submit-btn">Nộp bài</button>
      <button id="restart-btn">Làm lại</button>
    </div>
  </div>
</div>
<script>
const PART1 = [{"q": "Đại hội đại biểu toàn quốc lần thứ VI của Đảng Cộng sản Việt Nam (1986) đã", "options": ["tiếp tục đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước để khắc phục khó khăn.", "quyết tâm thay đổi tư duy kinh tế trên cơ sở điều chỉnh các mục tiêu chiến lược.", "đưa Việt Nam tích cực, chủ động hội nhập sâu rộng vào hệ thống xã hội chủ nghĩa.", "chính thức mở đầu công cuộc Đổi mới đất nước toàn diện, đồng bộ ở Việt Nam."], "correct": 3, "explain": "Đại hội VI chính thức mở đầu công cuộc Đổi mới toàn diện, đồng bộ; mục tiêu chiến lược (độc lập dân tộc – CNXH) không hề bị điều chỉnh, chỉ đổi mới tư duy và biện pháp thực hiện."}, {"q": "Trong công cuộc đổi mới đất nước ở Việt Nam (từ năm 1986), vai trò của kinh tế tư nhân ngày càng được củng cố và phát triển mạnh mẽ vì một trong những lí do nào?", "options": ["Là một động lực quan trọng nhất của nền kinh tế quốc gia.", "Nguồn vốn đầu tư nước ngoài (FDI) sụt giảm mạnh.", "Kinh tế nhà nước đã bị khủng hoảng và giải thể hoàn toàn.", "Kinh tế tư nhân không chịu sự quản lý của pháp luật."], "correct": 0, "explain": "Kinh tế tư nhân được Đảng xác định là một động lực quan trọng của nền kinh tế quốc dân trong quá trình Đổi mới."}, {"q": "Đảng Cộng sản Đông Dương đã thực hiện biện pháp nào sau đây nhằm phát huy khối đại đoàn kết dân tộc trong Cách mạng tháng Tám năm 1945?", "options": ["Triệu tập Quốc dân Đại hội tại Tân Trào để thống nhất lực lượng và ý chí của toàn dân.", "Ký kết Hiệp định Sơ bộ với Pháp để tranh thủ thời gian chuẩn bị lực lượng cách mạng.", "Thành lập chính quyền Xô viết ở các địa phương để thử nghiệm mô hình nhà nước mới.", "Kêu gọi toàn dân tham gia phong trào \"Tuần lễ vàng\" để ủng hộ chính quyền cách mạng."], "correct": 0, "explain": "Quốc dân Đại hội Tân Trào (8/1945) là biểu hiện rõ nhất của việc thống nhất ý chí, lực lượng toàn dân tộc trước Tổng khởi nghĩa."}, {"q": "Nhận xét nào sau đây không đúng về phong trào Tây Sơn (cuối thế kỉ XVIII) ở Việt Nam?", "options": ["Đảm nhận vai trò thống nhất đất nước và bảo vệ tổ quốc, chống xâm lược.", "Tạo điều kiện cho sự thống nhất mọi mặt của đất nước ở giai đoạn sau đó.", "Đã chấm dứt hoàn toàn chế độ quân chủ, mở ra thời đại mới trong lịch sử.", "Thể hiện khả năng to lớn của người nông dân nếu được tổ chức, lãnh đạo."], "correct": 2, "explain": "Tây Sơn chưa hề chấm dứt chế độ quân chủ – chế độ này vẫn tiếp tục tồn tại đến nhà Nguyễn."}, {"q": "Vào thế kỉ XVIII, nhà Tây Sơn tiến hành cuộc kháng chiến chống quân xâm lược nào sau đây?", "options": ["Đường.", "Minh.", "Thanh.", "Tống."], "correct": 2, "explain": "Nhà Tây Sơn kháng chiến chống quân xâm lược nhà Thanh (1789), dưới sự chỉ huy của Quang Trung."}, {"q": "Nội dung nào sau đây là yếu tố đóng vai trò quyết định đến sự hình thành của một trật tự thế giới mới sau Chiến tranh lạnh?", "options": ["Khả năng phát triển vũ khí công nghệ cao trên nền tảng hợp tác quân sự.", "Việc mở rộng phạm vi hoạt động của các tổ chức hợp tác quân sự khu vực.", "Cuộc chạy đua sức mạnh quốc gia tổng hợp, đặc biệt là sức mạnh kinh tế.", "Sự phân chia lại phạm vi ảnh hưởng và nơi chiếm đóng giữa các nước lớn."], "correct": 2, "explain": "Sau Chiến tranh lạnh, sức mạnh tổng hợp quốc gia – đặc biệt là kinh tế – trở thành yếu tố quyết định trật tự thế giới mới."}, {"q": "Sự kiện Nguyễn Ái Quốc bỏ phiếu tán thành gia nhập Quốc tế Cộng sản, tham gia sáng lập Đảng Cộng sản Pháp (1920) khẳng định điều nào sau đây?", "options": ["Sự thắng lợi cơ bản của phong trào công nhân trong cuộc đấu tranh chống lại thực dân Pháp.", "Bước ngoặt quan trọng, từ chủ nghĩa yêu nước đến với học thuyết cách mạng Mác - Lênin.", "Bước ngoặt từ phương pháp đấu tranh chính trị chuyển hẳn sang đấu tranh vũ trang, bạo lực.", "Sự chấm dứt hoàn toàn của khuynh hướng dân chủ tư sản trên toàn bộ bán đảo Đông Dương."], "correct": 1, "explain": "Đây là bước ngoặt lớn trong cuộc đời hoạt động cách mạng của Người: từ chủ nghĩa yêu nước đến với chủ nghĩa Mác – Lênin."}, {"q": "Từ đầu năm 1961, Mỹ chuyển sang thực hiện chiến lược \"Chiến tranh đặc biệt\" ở miền Nam Việt Nam vì một trong những lí do nào sau đây?", "options": ["Hình thức thống trị bằng chính quyền tay sai độc tài thất bại.", "Mặt trận Dân tộc giải phóng miền Nam Việt Nam thành lập.", "Mỹ muốn đưa quân đội sang miền Nam tham chiến trực tiếp.", "Khả năng đấu tranh hòa bình, chính trị không còn phù hợp."], "correct": 0, "explain": "Hình thức thống trị bằng chính quyền tay sai độc tài (chiến lược trước đó) thất bại, buộc Mỹ phải chuyển sang chiến lược mới."}, {"q": "Nhận xét nào sau đây là đúng về sự thành lập của Hiệp hội các quốc gia Đông Nam Á (ASEAN)?", "options": ["Là kết quả tất yếu của quá trình nhất thể hóa khu vực.", "Nhằm giải quyết những vấn đề đối nội và đối ngoại.", "Phản ánh nỗ lực kiến tạo môi trường hòa bình của Mỹ.", "Nhằm chống lại cuộc chiến tranh xâm lược của Pháp."], "correct": 1, "explain": "ASEAN ra đời (1967) nhằm giải quyết những vấn đề đối nội và đối ngoại chung của các nước trong khu vực."}, {"q": "Hiệp định Sơ bộ ký kết giữa đại diện Chính phủ nước Việt Nam Dân chủ Cộng hòa và đại diện Chính phủ Pháp ngày 6/3/1946 đã", "options": ["công nhận được nền độc lập của nước Việt Nam.", "công nhận tính thống nhất của nước Việt Nam.", "thừa nhận các quyền dân tộc cơ bản của Việt Nam.", "thừa nhận độc lập và chủ quyền của Việt Nam."], "correct": 2, "explain": "Hiệp định Sơ bộ mới chỉ công nhận Việt Nam là một quốc gia tự do, có chính phủ, quân đội, tài chính riêng – chưa phải độc lập, thống nhất hoàn toàn như các phương án A, B, D nêu."}, {"q": "Tháng 12-1986, Đại hội VI của Đảng chủ trương phát triển nền kinh tế hàng hóa nhiều thành phần; Tháng 3-1989, Hội nghị Trung ương 6 (khóa VI) quyết định xóa bỏ cơ chế hai giá; Tháng 4-2001, Đại hội IX lần đầu tiên chính thức đưa ra khái niệm \"nền kinh tế thị trường định hướng xã hội chủ nghĩa\". Những sự kiện trên là minh chứng cho sự phát triển nhận thức lý luận nào sau đây của Đảng?", "options": ["Quá trình từng bước loại bỏ vai trò quản lý điều tiết kinh tế vĩ mô của cơ quan bộ máy nhà nước.", "Quá trình chuyển đổi từng bước từ tư duy kinh tế cũ sang kinh tế thị trường định hướng XHCN.", "Quá trình áp đặt các quy định hành chính nhằm kìm hãm sự phát triển tự do của khu vực tư nhân.", "Quá trình quay trở lại với mô hình hợp tác xã tập trung để củng cố vững chắc kinh tế quốc doanh."], "correct": 1, "explain": "Đây là quá trình chuyển đổi từng bước, liên tục từ tư duy kinh tế cũ (kế hoạch hóa tập trung) sang kinh tế thị trường định hướng XHCN."}, {"q": "Nội dung nào sau đây không phải là một trong những triển vọng của Cộng đồng ASEAN trong xu thế hội nhập quốc tế và toàn cầu hóa?", "options": ["ASEAN đã có cơ sở hợp tác tích cực trong nội khối và đối tác bên ngoài.", "Từ đầu thế kỷ XXI, vị thế của ASEAN đã nâng cao trên trường quốc tế.", "Sự vươn lên mạnh mẽ của các nền kinh tế trong khu vực Đông Nam Á.", "ASEAN trở thành một liên minh chính trị, quân sự lớn mạnh ở châu Á."], "correct": 3, "explain": "ASEAN không phải và không có triển vọng trở thành một liên minh chính trị – quân sự."}, {"q": "Việc Campuchia trở thành thành viên của ASEAN có ý nghĩa nào sau đây?", "options": ["Tạo cơ sở để ASEAN trở thành một liên minh quân sự thống nhất trong khu vực.", "Chấm dứt hoàn toàn các mâu thuẫn chính trị, xung đột trong khu vực Đông Nam Á.", "Làm thay đổi căn bản nguyên tắc hoạt động và cơ chế ra quyết định của ASEAN.", "Hoàn tất quá trình mở rộng ASEAN từ 5 đến 10, tăng cường đoàn kết của khu vực."], "correct": 3, "explain": "Campuchia gia nhập ASEAN năm 1999, hoàn tất quá trình mở rộng ASEAN từ 5 lên đủ 10 nước Đông Nam Á."}, {"q": "Cách mạng dân chủ nhân dân được hoàn thành ở các nước Đông Âu trong những năm 1948 – 1949 đánh dấu", "options": ["sự xác lập hoàn chỉnh của cục diện hai cực, hai phe trên thế giới.", "bước phát triển mới của phong trào giải phóng dân tộc thế giới.", "bước phát triển mới của phong trào cộng sản, công nhân quốc tế.", "chủ nghĩa xã hội thắng thế hoàn toàn trên phạm vi toàn thế giới."], "correct": 0, "explain": "Việc hoàn thành CM dân chủ nhân dân ở Đông Âu góp phần củng cố hệ thống XHCN, đánh dấu sự xác lập hoàn chỉnh cục diện hai cực, hai phe."}, {"q": "Nội dung nào sau đây phản ánh đúng ý nghĩa cuộc chiến đấu bảo vệ biên giới phía Bắc của quân dân Việt Nam năm 1979?", "options": ["Tạo bước đệm quan trọng để Việt Nam gia nhập Liên hợp quốc.", "Bảo vệ được vững chắc chủ quyền và toàn vẹn lãnh thổ đất nước.", "Chấm dứt tham vọng xâm lược Đông Nam Á của Trung Quốc.", "Khẳng định sức mạnh tình đoàn kết của ba nước Đông Dương."], "correct": 1, "explain": "Ý nghĩa quan trọng nhất là bảo vệ vững chắc chủ quyền, toàn vẹn lãnh thổ đất nước."}, {"q": "Nhận xét nào sau đây phản ánh đúng về cuộc kháng chiến chống Pháp ở Nam Bộ trong khoảng thời gian cuối năm 1945 đầu năm 1946?", "options": ["Diễn ra khi phát xít Nhật đầu hàng và đã rút quân khỏi nước Việt Nam.", "Có sự phối hợp chặt chẽ với các nước xã hội chủ nghĩa trên thế giới.", "Sức mạnh toàn dân tộc trong cuộc chiến đấu được phát huy hiệu quả.", "Có sự tham gia trực tiếp của lực lượng quân đội Liên Xô và Triều Tiên."], "correct": 2, "explain": "Cuộc kháng chiến ở Nam Bộ thể hiện sức mạnh toàn dân tộc được phát huy hiệu quả ngay từ những ngày đầu."}, {"q": "Quyết định nào sau đây của Hội nghị I-an-ta (tháng 2-1945) đã tạo điều kiện thuận lợi cho cách mạng Việt Nam giành độc lập dân tộc?", "options": ["Tiêu diệt tận gốc chủ nghĩa phát xít Đức và chủ nghĩa quân phiệt Nhật.", "Thống nhất thành lập Liên hợp quốc để duy trì hòa bình trên thế giới.", "Đồng ý cho Trung Hoa Dân quốc và Anh vào giải giáp ở Đông Dương.", "Đông Nam Á vẫn thuộc phạm vi ảnh hưởng của các nước phương Tây."], "correct": 0, "explain": "Việc tiêu diệt tận gốc chủ nghĩa phát xít, buộc Nhật đầu hàng đã tạo thời cơ để Việt Nam Tổng khởi nghĩa giành chính quyền."}, {"q": "Sự kiện nào sau đây đã thiết lập nền tảng pháp lý cho việc duy trì hòa bình và an ninh quốc tế ngay sau Chiến tranh thế giới thứ hai?", "options": ["Việc Hiến chương Liên hợp quốc thông qua và có hiệu lực.", "Hiệp hội các quốc gia Đông Nam Á được chính thức ra đời.", "Hiệp định Giơ-ne-vơ về Đông Dương được các nước kí kết.", "Hiệp ước Bắc Đại Tây Dương thành lập và chi phối thế giới."], "correct": 0, "explain": "Hiến chương Liên hợp quốc có hiệu lực (10/1945) là nền tảng pháp lý quốc tế đầu tiên về hòa bình, an ninh sau Chiến tranh thế giới thứ hai."}, {"q": "Trong công cuộc đổi mới đất nước (từ sau năm 1986), Việt Nam chú trọng thực hiện đường lối \"đa phương hóa, đa dạng hóa\" nhằm", "options": ["chỉ hợp tác với các nước cùng chế độ chính trị.", "đối đầu quân sự với các cường quốc hàng đầu.", "phá thế bao vây cấm vận, hội nhập để phát triển.", "thay thế vai trò \"trung tâm\" của Liên hợp quốc."], "correct": 2, "explain": "Đường lối đa phương hóa, đa dạng hóa nhằm phá thế bao vây, cấm vận, hội nhập để phát triển đất nước."}, {"q": "Cuộc kháng chiến chống Mỹ, cứu nước (1954 - 1975) và cuộc Cách mạng tháng Tám năm 1945 của nhân dân Việt Nam đều", "options": ["hoàn thành hai nhiệm vụ cách mạng: kháng chiến và kiến quốc.", "phát triển từ chiến tranh du kích lên tổng tiến công và khởi nghĩa.", "là thắng lợi sự kết hợp chặt chẽ giữa hậu phương và tiền tuyến.", "mở ra kỉ nguyên mới trong tiến trình phát triển của lịch sử dân tộc."], "correct": 3, "explain": "Cả hai đều mở ra một kỷ nguyên mới trong lịch sử dân tộc (độc lập, tự do – và sau đó độc lập, thống nhất, đi lên CNXH)."}, {"q": "Nội dung nào sau đây phản ánh đúng đặc điểm của chủ nghĩa xã hội từ năm 1991 đến nay?", "options": ["Nhận được sự giúp đỡ và ủng hộ của Mĩ do có chung ý thức hệ.", "Một số nước xã hội chủ nghĩa đẩy mạnh việc hội nhập quốc tế.", "Hệ thống chủ nghĩa xã hội đã được nối liền từ châu Âu sang Á.", "Bước đầu mở rộng phạm vi ảnh hưởng đến khu vực Mỹ Latinh."], "correct": 1, "explain": "Từ 1991, một số nước XHCN còn lại (Việt Nam, Trung Quốc, Cuba, Lào...) đẩy mạnh cải cách, mở cửa, hội nhập quốc tế."}, {"q": "Cho đoạn tư liệu: Tiến sĩ Ahmed - Nguyên Giám đốc UNESCO khu vực châu Á-Thái Bình Dương đã nhận xét: \"Chỉ có ít nhân vật lịch sử trở thành một bộ phận của huyền thoại khi còn sống và rõ ràng cụ Hồ Chí Minh là một trong số đó, Người sẽ được ghi nhớ không phải chỉ là người giải phóng cho Tổ quốc và nhân dân bị đô hộ, mà còn là một nhà hiền triết hiện đại đã mang lại một viễn cảnh và hy vọng mới cho những người đấu tranh không khoan nhượng để loại bỏ bất công, bất bình đẳng khỏi trái đất này.\" (Dẫn theo Trần Văn Giàu, Nghiên cứu Tư tưởng Hồ Chí Minh, Tập 2, Viện Hồ Chí Minh, Hà Nội, 1993, tr. 42). Việc Hồ Chí Minh được xem là \"một bộ phận của huyền thoại\" chứng tỏ", "options": ["uy tín to lớn trong phong trào của nữ quyền.", "sự công nhận, tin cậy của tổ chức Liên hợp quốc.", "tầm ảnh hưởng vượt ra ngoài phạm vi quốc gia.", "vai trò quyết định đối với cách mạng thế giới."], "correct": 2, "explain": "“Huyền thoại khi còn sống” cho thấy tầm ảnh hưởng của Người vượt ra ngoài phạm vi một quốc gia."}, {"q": "Nội dung nào sau đây phản ánh đúng vai trò của Hồ Chí Minh được đề cập trong đoạn tư liệu?", "options": ["Lãnh tụ tối cao của tổ chức Quốc tế Cộng sản.", "Người sáng lập phong trào giải phóng dân tộc.", "Lãnh đạo chủ chốt của hệ thống xã hội chủ nghĩa.", "Nhà giải phóng dân tộc và nhà hiền triết hiện đại."], "correct": 3, "explain": "Tư liệu khắc họa Người vừa là nhà giải phóng dân tộc, vừa là nhà hiền triết hiện đại."}, {"q": "Theo đoạn tư liệu, Hồ Chí Minh được xem là \"một bộ phận của huyền thoại\" vì một trong những lí do nào sau đây?", "options": ["Có vai trò quan trọng trong phong trào cộng sản quốc tế.", "Có tầm ảnh hưởng lớn và được ghi nhận ngay khi còn sống.", "Là người tham gia nhiều hội nghị quốc tế ở Trung Đông.", "Đưa ra nhiều quan điểm mới trong thời kì Đổi mới đất nước."], "correct": 1, "explain": "Người được ghi nhận, có tầm ảnh hưởng lớn ngay khi còn sống – điều hiếm có với một nhân vật lịch sử."}];
const PART2 = [{"context": "“Chúng ta kháng chiến, dân tộc bạn Miên, Lào cũng kháng chiến. Bọn thực dân Pháp và bọn can thiệp Mỹ là kẻ thù của ta và của dân tộc Miên, Lào. Vì vậy, ta phải ra sức giúp đỡ anh em Miên, Lào, giúp đỡ kháng chiến Miên, Lào; và tiến đến thành lập Mặt trận thống nhất các dân tộc Việt - Miên – Lào.”\n(Hồ Chí Minh, Toàn tập, Tập 6, NXB Chính trị Quốc gia, Hà Nội, 2002, tr. 174)", "items": [{"text": "Việc thành lập Mặt trận thống nhất Việt - Miên - Lào diễn ra trong bối cảnh hệ thống xã hội chủ nghĩa đang trong quá trình vận động hình thành.", "correct": true, "explain": "Đúng – Phù hợp bối cảnh đầu thập niên 1950, khi hệ thống xã hội chủ nghĩa thế giới đang trong quá trình hình thành (Đông Âu, Trung Quốc...)."}, {"text": "Đoạn tư liệu trên đề cập trực tiếp chủ trương đoàn kết quốc tế trong kháng chiến chống Pháp (1945 – 1954) của Đảng Cộng sản Việt Nam.", "correct": true, "explain": "Đúng – Trực tiếp đề cập chủ trương đoàn kết quốc tế trong kháng chiến chống Pháp (1945-1954)."}, {"text": "Trong cuộc kháng chiến chống Pháp (1945 – 1954), Việt Nam cần \"ra sức giúp đỡ\" kháng chiến của Lào và Campuchia vì yêu cầu của Quốc tế Cộng sản.", "correct": false, "explain": "Sai – Tư liệu nêu rõ lý do là cùng chung kẻ thù (thực dân Pháp, can thiệp Mỹ), không phải do “yêu cầu của Quốc tế Cộng sản” (tổ chức này đã giải tán từ 1943)."}, {"text": "Việc thành lập Mặt trận thống nhất Việt – Miên – Lào là yếu tố quan trọng dẫn đến thắng lợi của cuộc kháng chiến Pháp (1945 – 1954) của nhân dân Việt Nam.", "correct": true, "explain": "Đúng – Đoàn kết ba nước Đông Dương là một trong những yếu tố quan trọng góp phần vào thắng lợi chung của kháng chiến chống Pháp."}]}, {"context": "“Quốc dân chúng tôi đã giành được quyền độc lập và giữ vững nền độc lập, thiết tha yêu cầu các ngài công nhận nền độc lập ấy và nhận chúng tôi vào Hội đồng Liên hợp quốc.”\n(Hồ Chí Minh, Toàn tập, Tập 4, NXB Chính trị Quốc gia, 2000, tr.180)", "items": [{"text": "Lời kêu gọi trong đoạn tư liệu là biểu hiện của việc Việt Nam chủ trương từ bỏ độc lập dân tộc để gia nhập các tổ chức quốc tế lớn trên thế giới.", "correct": false, "explain": "Sai – Ngược lại, Việt Nam khẳng định đã giành và giữ vững độc lập, không hề “từ bỏ độc lập”."}, {"text": "Lời kêu gọi trong đoạn tư liệu được đưa ra trong bối cảnh Việt Nam vừa giành được độc lập và mong muốn được quốc tế công nhận.", "correct": true, "explain": "Đúng – Phù hợp bối cảnh: lời kêu gọi được đưa ra ngay sau Cách mạng tháng Tám 1945."}, {"text": "Việc đề nghị tham gia Hội đồng Liên hợp quốc là do Việt Nam mong muốn được công nhận về mặt pháp lý và tranh thủ sự ủng hộ của quốc tế.", "correct": true, "explain": "Đúng – Phù hợp mục đích: được công nhận về mặt pháp lý và tranh thủ sự ủng hộ của quốc tế."}, {"text": "Với lời kêu gọi trong đoạn tư liệu, Việt Nam đã chính thức trở thành thành viên thứ 149 của Liên hợp quốc ngay sau khi vừa mới giành độc lập.", "correct": false, "explain": "Sai – Việt Nam chính thức là thành viên thứ 149 của Liên hợp quốc vào năm 1977, cách xa thời điểm 1945 hơn 30 năm."}]}, {"context": "“Điều kiện cốt yếu để công cuộc đổi mới giữ được định hướng xã hội chủ nghĩa và đi đến thành công là trong quá trình đổi mới Đảng phải kiên trì và vận dụng sáng tạo chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh.” (Văn kiện Đảng toàn tập, Tập 51, NXB Chính trị quốc gia Sự thật, Hà Nội, 2007, tr. 87)\n\n“Trong quá trình đổi mới phải kiên trì mục tiêu độc lập dân tộc và chủ nghĩa xã hội trên nền tảng chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh.” (Văn kiện Đảng toàn tập, Tập 64, NXB. Chính trị quốc gia Sự thật, Hà Nội, 2016, tr. 68)", "items": [{"text": "Việc kiên trì mục tiêu độc lập dân tộc gắn với chủ nghĩa xã hội là do đây là nền tảng bảo đảm định hướng đúng đắn cho quá trình đổi mới ở Việt Nam.", "correct": true, "explain": "Đúng – Phù hợp logic: đây là nền tảng bảo đảm định hướng đúng đắn cho quá trình đổi mới."}, {"text": "Những quan điểm trong đoạn tư liệu đã chứng tỏ Việt Nam đã hoàn toàn đạt được mục tiêu đổi mới và xây dựng thành công chủ nghĩa xã hội trong thực tế.", "correct": false, "explain": "Sai – Tư liệu chỉ nói về điều kiện/kiên trì mục tiêu, không có nghĩa Việt Nam “đã hoàn toàn đạt được” mục tiêu xây dựng CNXH."}, {"text": "Quan điểm \"kiên trì mục tiêu độc lập dân tộc gắn với chủ nghĩa xã hội\" được bắt đầu nêu ra trong bối cảnh Việt Nam đẩy mạnh công cuộc đổi mới đất nước.", "correct": true, "explain": "Đúng – Quan điểm này được nêu và nhấn mạnh xuyên suốt từ khi Việt Nam đẩy mạnh công cuộc đổi mới."}, {"text": "Điều kiện cốt yếu để đổi mới ở Việt Nam thành công là việc từ bỏ nền tảng tư tưởng cũ và xây dựng một hệ tư tưởng hoàn toàn mới phù hợp với xu thế quốc tế.", "correct": false, "explain": "Sai – Ngược lại, điều kiện cốt yếu là kiên trì, vận dụng sáng tạo chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh, không phải “từ bỏ” nền tảng tư tưởng cũ."}]}, {"context": "“Ngày nay, toàn cầu hoá mà cốt lõi là toàn cầu hoá kinh tế đã trở thành một xu thế khách quan của thế giới đương đại. Xu thế này được hình thành từ đầu thế kỷ XX, được đẩy mạnh trong hai thập niên cuối thế kỷ XX và chắc chắn sẽ tiếp tục diễn ra trong thế kỷ XXI. Xu thế này tác động đến mọi lĩnh vực của đời sống xã hội (chính trị, văn hoá, xã hội...), đã và đang trở thành cơn lốc cuốn hút hầu hết các khu vực và các nước trên thế giới, chi phối những biến đổi của tình hình thế giới hiện nay và sắp tới.”\n(Nguyễn Đức Bình (Chủ biên), Những đặc điểm lớn của thế giới đương đại (Sách tham khảo), NXB Chính trị Quốc gia, Hà Nội, 2007, tr.100)", "items": [{"text": "Trong cục diện thế giới sau Chiến tranh lạnh, xu thế toàn cầu hóa giữ vị trí trung tâm trong sức mạnh tổng hợp của các quốc gia, có tác động sâu rộng đến mọi lĩnh vực và chủ thể.", "correct": false, "explain": "Sai – Tư liệu không nói toàn cầu hóa “giữ vị trí trung tâm trong sức mạnh tổng hợp quốc gia”; đây là suy diễn không đúng nội dung gốc."}, {"text": "Toàn cầu hóa là một xu thế khách quan, thực tế không thể đảo ngược của thế giới đương đại vì không chịu sự chi phối của các nước tư bản chủ nghĩa.", "correct": false, "explain": "Sai – Toàn cầu hóa trên thực tế vẫn chịu sự chi phối lớn từ các nước tư bản phát triển, không phải “không chịu sự chi phối”."}, {"text": "Đoạn tư liệu trên đề cập đến sự phát triển của xu thế chủ đạo thế giới sau Chiến tranh lạnh.", "correct": true, "explain": "Đúng – Toàn cầu hóa là một trong những xu thế chủ đạo của thế giới sau Chiến tranh lạnh."}, {"text": "Cụm từ \"cơn lốc cuốn hút hầu hết các khu vực và các nước\" phản ánh tính khách quan, phổ biến của xu thế toàn cầu hóa sau Chiến tranh lạnh.", "correct": true, "explain": "Đúng – Trực tiếp theo tư liệu, phản ánh đúng tính khách quan, phổ biến của xu thế toàn cầu hóa."}]}];

const quizEl = document.getElementById('quiz');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const scoreLabel = document.getElementById('scoreLabel');
const submitBtn = document.getElementById('submit-btn');
const restartBtn = document.getElementById('restart-btn');
const timerEl = document.getElementById('timer');

const TOTAL1 = PART1.length;
const TOTAL2 = PART2.length * 4;
const TOTAL = TOTAL1 + TOTAL2;

let answers1 = new Array(PART1.length).fill(null);
let answers2 = PART2.map(g => new Array(g.items.length).fill(null));
let submitted = false;

function countAnswered(){
  let c = answers1.filter(a => a !== null).length;
  answers2.forEach(g => { c += g.filter(a => a !== null).length; });
  return c;
}

function updateProgress(){
  const answered = countAnswered();
  const pct = (answered / TOTAL) * 100;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = answered + '/' + TOTAL + ' đã trả lời';
}

function render(){
  quizEl.innerHTML = '';

  const t1 = document.createElement('div');
  t1.className = 'section-title';
  t1.textContent = 'PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN (Câu 1 - 24)';
  quizEl.appendChild(t1);

  PART1.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    const h3 = document.createElement('h3');
    h3.innerHTML = '<span class="qnum">Câu ' + (qi+1) + ':</span> ' + q.q;
    card.appendChild(h3);

    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      label.className = 'option';
      if(answers1[qi] === oi) label.classList.add('selected');

      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'p1q'+qi;
      input.value = oi;
      if(answers1[qi] === oi) input.checked = true;

      const span = document.createElement('span');
      const letter = String.fromCharCode(65+oi);
      span.textContent = letter + '. ' + opt;

      label.appendChild(input);
      label.appendChild(span);
      label.addEventListener('click', () => {
        if(submitted) return;
        answers1[qi] = oi;
        updateProgress();
        render();
      });
      card.appendChild(label);
    });

    const explain = document.createElement('div');
    explain.className = 'explain-box' + (submitted ? ' show' : '');
    explain.innerHTML = '<b>Giải thích:</b> ' + q.explain;
    card.appendChild(explain);

    quizEl.appendChild(card);
  });

  const t2 = document.createElement('div');
  t2.className = 'section-title';
  t2.textContent = 'PHẦN II: TRẮC NGHIỆM ĐÚNG - SAI (Câu 1 - 4)';
  quizEl.appendChild(t2);

  const letters = ['a','b','c','d'];
  PART2.forEach((group, gi) => {
    const card = document.createElement('div');
    card.className = 'tf-card';
    const h3 = document.createElement('h3');
    h3.style.color = '#fff';
    h3.style.margin = '0 0 10px';
    h3.textContent = 'Câu ' + (gi+1) + '. Cho đoạn tư liệu sau đây:';
    card.appendChild(h3);

    const ctx = document.createElement('div');
    ctx.className = 'context';
    ctx.textContent = group.context;
    card.appendChild(ctx);

    group.items.forEach((item, ii) => {
      const row = document.createElement('div');
      row.className = 'tf-item';

      const txt = document.createElement('div');
      txt.className = 'tf-text';
      txt.textContent = letters[ii] + ') ' + item.text;
      row.appendChild(txt);

      const btnWrap = document.createElement('div');
      btnWrap.className = 'tf-buttons';

      ['Đúng','Sai'].forEach((label, bi) => {
        const isTrueBtn = (bi === 0);
        const btn = document.createElement('div');
        btn.className = 'tf-btn';
        btn.textContent = label;
        const chosen = answers2[gi][ii];
        if(chosen === isTrueBtn) btn.classList.add('selected');
        btn.addEventListener('click', () => {
          if(submitted) return;
          answers2[gi][ii] = isTrueBtn;
          updateProgress();
          render();
        });
        btnWrap.appendChild(btn);
      });
      row.appendChild(btnWrap);

      if(submitted){
        const exp = document.createElement('div');
        exp.className = 'explain-box show';
        exp.style.marginTop = '8px';
        exp.innerHTML = '<b>' + (item.correct ? 'Đúng' : 'Sai') + '</b> – ' + item.explain.replace(/^(Đúng|Sai)\s*–\s*/, '');
        row.appendChild(exp);
      }

      card.appendChild(row);
    });

    quizEl.appendChild(card);
  });

  if(submitted){
    document.querySelectorAll('.qcard').forEach((card, qi) => {
      const q = PART1[qi];
      const opts = card.querySelectorAll('.option');
      opts.forEach((el, oi) => {
        el.classList.add('disabled');
        el.classList.remove('selected');
        if(oi === q.correct){
          el.classList.add('correct');
        } else if(answers1[qi] === oi){
          el.classList.add('wrong');
        }
      });
    });
    document.querySelectorAll('.tf-card').forEach((card, gi) => {
      const group = PART2[gi];
      const rows = card.querySelectorAll('.tf-item');
      rows.forEach((row, ii) => {
        const item = group.items[ii];
        const btns = row.querySelectorAll('.tf-btn');
        btns.forEach((btn, bi) => {
          btn.classList.add('disabled');
          btn.classList.remove('selected');
          const isTrueBtn = (bi === 0);
          if(isTrueBtn === item.correct){
            btn.classList.add('correct');
          } else if(answers2[gi][ii] === isTrueBtn){
            btn.classList.add('wrong');
          }
        });
      });
    });
  }
}

function grade(){
  let score1 = 0;
  answers1.forEach((a,i) => { if(a === PART1[i].correct) score1++; });
  let score2 = 0;
  answers2.forEach((g, gi) => {
    g.forEach((a, ii) => { if(a === PART2[gi].items[ii].correct) score2++; });
  });
  return {score1, score2, total: score1+score2};
}

const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xojoynke';
let quizStartTime = Date.now();

function formatTimeSpent(ms){
  const totalSec = Math.round(ms/1000);
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return m + ' phút ' + s + ' giây';
}

function formatSubmittedNow(){
  const d = new Date();
  const hh = d.getHours().toString().padStart(2,'0');
  const mm = d.getMinutes().toString().padStart(2,'0');
  const dd = d.getDate();
  const mo = d.getMonth()+1;
  const yy = d.getFullYear();
  return hh + ':' + mm + ' ' + dd + '/' + mo + '/' + yy;
}

function submitViaHiddenIframe(fields){
  return new Promise((resolve) => {
    let iframe = document.getElementById('formspree-fallback-iframe');
    if(!iframe){
      iframe = document.createElement('iframe');
      iframe.id = 'formspree-fallback-iframe';
      iframe.name = 'formspree-fallback-iframe';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
    }
    const form = document.createElement('form');
    form.action = FORMSPREE_ENDPOINT;
    form.method = 'POST';
    form.target = 'formspree-fallback-iframe';
    form.style.display = 'none';
    Object.entries(fields).forEach(([k,v]) => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = k;
      input.value = v;
      form.appendChild(input);
    });
    document.body.appendChild(form);
    let done = false;
    iframe.onload = () => {
      if(done) return;
      done = true;
      form.remove();
      resolve(true);
    };
    form.submit();
    setTimeout(() => {
      if(done) return;
      done = true;
      form.remove();
      resolve(true);
    }, 4000);
  });
}

async function sendResultEmail(score1, score2, total, timeSpentMs){
  const statusEl = document.getElementById('emailStatus');
  statusEl.textContent = 'Đang gửi kết quả qua email...';
  statusEl.style.color = '#c7cdd6';

  const fields = {
    subject_name: 'Lịch sử - Đề số 65',
    score_part1: score1 + '/' + TOTAL1,
    score_part2: score2 + '/' + TOTAL2,
    total_score: total + '/' + TOTAL,
    time_spent: formatTimeSpent(timeSpentMs),
    submitted: formatSubmittedNow(),
    _subject: 'Kết quả đề Sử 65 - ' + total + '/' + TOTAL
  };

  try{
    const fd = new FormData();
    Object.entries(fields).forEach(([k,v]) => fd.append(k, v));
    const res = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: fd
    });
    if(res.ok){
      statusEl.innerHTML = '✔ Đã gửi kết quả về email!';
      statusEl.style.color = '#3fae5a';
      return;
    }
    throw new Error('HTTP ' + res.status);
  }catch(err){
    statusEl.textContent = 'Không gửi được trực tiếp, đang thử cách khác...';
    try{
      await submitViaHiddenIframe(fields);
      statusEl.innerHTML = '✔ Đã gửi yêu cầu kết quả (phương án dự phòng). Kiểm tra email trong vài phút.';
      statusEl.style.color = '#3fae5a';
    }catch(err2){
      statusEl.innerHTML = '⚠ Không thể gửi email tự động. <button id="retryEmailBtn" style="text-decoration:underline;background:none;border:none;color:#f4c531;cursor:pointer;padding:0;font-size:0.78rem;">Thử lại</button>';
      statusEl.style.color = '#d9534f';
      const retryBtn = document.getElementById('retryEmailBtn');
      if(retryBtn){
        retryBtn.addEventListener('click', () => sendResultEmail(score1, score2, total, timeSpentMs));
      }
    }
  }
}

submitBtn.addEventListener('click', () => {
  submitted = true;
  const {score1, score2, total} = grade();
  const timeSpentMs = Date.now() - quizStartTime;
  scoreLabel.textContent = 'Điểm: Phần I ' + score1 + '/' + TOTAL1 + ' · Phần II ' + score2 + '/' + TOTAL2 + ' · Tổng ' + total + '/' + TOTAL;
  submitBtn.style.display = 'none';
  restartBtn.style.display = 'inline-block';
  render();
  clearInterval(timerInterval);
  sendResultEmail(score1, score2, total, timeSpentMs);
  window.scrollTo({top:0, behavior:'smooth'});
});

restartBtn.addEventListener('click', () => {
  answers1 = new Array(PART1.length).fill(null);
  answers2 = PART2.map(g => new Array(g.items.length).fill(null));
  submitted = false;
  submitBtn.style.display = 'inline-block';
  submitBtn.disabled = false;
  restartBtn.style.display = 'none';
  scoreLabel.textContent = 'Điểm: Phần I 0/' + TOTAL1 + ' · Phần II 0/' + TOTAL2 + ' · Tổng 0/' + TOTAL;
  document.getElementById('emailStatus').textContent = '';
  quizStartTime = Date.now();
  updateProgress();
  render();
  startTimer(45*60);
  window.scrollTo({top:0, behavior:'smooth'});
});

let timerInterval;
function startTimer(seconds){
  let remaining = seconds;
  updateTimerDisplay(remaining);
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remaining--;
    if(remaining <= 0){
      remaining = 0;
      updateTimerDisplay(remaining);
      clearInterval(timerInterval);
      if(!submitted) submitBtn.click();
      return;
    }
    updateTimerDisplay(remaining);
  }, 1000);
}
function updateTimerDisplay(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const ss = (s%60).toString().padStart(2,'0');
  timerEl.textContent = m + ':' + ss;
}

const snowLayer = document.getElementById('snow-layer');
const flakeChars = ['❋','❄','❅','❆','✻'];
for(let i=0;i<24;i++){
  const flake = document.createElement('div');
  flake.className = 'snowflake';
  flake.textContent = flakeChars[Math.floor(Math.random()*flakeChars.length)];
  flake.style.left = Math.random()*100 + '%';
  flake.style.fontSize = (10 + Math.random()*12) + 'px';
  flake.style.opacity = (0.2 + Math.random()*0.5).toFixed(2);
  const duration = 10 + Math.random()*14;
  flake.style.animationDuration = duration + 's';
  flake.style.animationDelay = (-Math.random()*duration) + 's';
  snowLayer.appendChild(flake);
}

render();
updateProgress();
startTimer(45*60);
</script>
